name: Release

# Push a tag equal to the manifest version (no `v` prefix, e.g. `0.1.0`).
# Obsidian installs main.js, manifest.json and styles.css from the release.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check tag matches manifest version
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./manifest.json").version')"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" main.js manifest.json styles.css
