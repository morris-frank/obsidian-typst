# Hooks call the mise-managed binaries (language: system) so tool versions live
# only in mise.toml. Generic file hygiene comes from upstream repos.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: pnpm run fmt:check
        pass_filenames: false
        files: \.(ts|mjs|cjs|json|css|md)$

      - id: eslint
        name: eslint
        language: system
        entry: pnpm run lint
        pass_filenames: false
        files: \.ts$

      - id: typecheck
        name: typecheck
        language: system
        entry: pnpm run typecheck
        pass_filenames: false
        files: \.ts$

      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks git --staged --redact --verbose
        pass_filenames: false

      # pre-push backstop: a full type-checked production build must succeed.
      - id: build
        name: build
        language: system
        entry: pnpm run build
        pass_filenames: false
        always_run: true
        stages: [pre-push]
